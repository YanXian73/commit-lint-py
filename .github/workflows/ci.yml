name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check

      - name: Run pytest
        run: uv run pytest
